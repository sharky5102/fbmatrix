<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>fbmserve</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div>
        <h1>fbmserve</h1>
        <p id="status">Connecting</p>
      </div>
      <div class="signal" id="signal"></div>
    </header>

    <nav class="mode-switch" aria-label="Input mode">
      <button id="mode-effect" type="button" data-mode="effect">Effect</button>
      <button id="mode-ndi" type="button" data-mode="ndi">NDI</button>
      <button id="mode-network" type="button" data-mode="network_matrix">Network Matrix</button>
    </nav>

    <section class="workspace" id="workspace">
      <aside class="lists">
        <div>
          <h2>Framebuffer</h2>
          <nav class="effects" id="effects" aria-label="Effects"></nav>
        </div>
      </aside>

      <section class="panel">
        <div class="preview" id="preview">
          <canvas id="swatch" width="320" height="180"></canvas>
        </div>

        <div class="controls">
          <div class="effect-settings" id="effect-settings">
            <div class="palette-controls">
              <label>
                <span>Color 1</span>
                <input id="color1" type="color" value="#0000ff">
              </label>
              <label>
                <span>Color 2</span>
                <input id="color2" type="color" value="#ffff00">
              </label>
              <label>
                <span>Color 3</span>
                <input id="color3" type="color" value="#ff0000">
              </label>
            </div>
            <label>
              <span>Speed</span>
              <input id="speed" type="range" min="0" max="4" step="0.01" value="1">
            </label>
            <label class="check-row">
              <input id="autoplay" type="checkbox">
              <span>Autoplay</span>
            </label>
            <label>
              <span>Interval seconds</span>
              <input id="autoplay-interval" type="number" min="1" max="3600" step="1" value="30">
            </label>
          </div>
        </div>
      </section>
    </section>

    <section class="ndi-panel" id="ndi-panel" hidden>
      <label>
        <span>NDI source</span>
        <select id="ndi-source"></select>
        <small id="ndi-status" class="input-status" hidden></small>
        <strong id="ndi-error" class="input-error" hidden></strong>
      </label>
    </section>

    <section class="ndi-panel" id="network-panel" hidden>
      <label><span>Protocol</span><select disabled><option>ArtNet</option></select></label>
      <label><span>Matrix size</span><select id="matrix-size">
        <option value="16">16 &times; 16</option><option value="32">32 &times; 32</option><option value="64">64 &times; 64</option>
      </select></label>
      <label><span>Channels per universe</span><select id="matrix-channels">
        <option value="510">510 - keep RGB pixels together</option>
        <option value="512">512 - allow pixels across universes</option>
      </select></label>
      <label><span>Starting universe (zero-based Art-Net address)</span>
        <input id="matrix-start" type="number" min="0" max="32767" step="1" value="0">
      </label>
      <label><span>Starting address in first universe</span>
        <input id="matrix-address" type="number" min="1" max="510" step="1" value="1">
      </label>
      <p>RGB, left to right, top to bottom. Match channel packing to your sender. UDP port 6454.</p>
      <small id="matrix-status" class="input-status"></small>
      <strong id="matrix-error" class="input-error" hidden></strong>
    </section>

    <section class="output-controls" aria-label="Output controls">
      <div>
        <h2>Emitter shader</h2>
        <nav class="effects" id="led-effects" aria-label="Emitter shaders"></nav>
      </div>
      <div class="output-settings">
        <label>
          <span>Brightness</span>
          <input id="brightness" type="range" min="0" max="1" step="0.001" value="1">
        </label>
        <label>
          <span>Supersample</span>
          <input id="supersample" type="range" min="0" max="16" step="0.1" value="3">
        </label>
      </div>
    </section>
  </main>

  <script src="/app.js"></script>
</body>
</html>
